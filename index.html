<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kåbo Pizzeria – förslag på ny hemsida</title>
<link rel="icon" href="img/logo.jpg">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5eee1;color:#1c1916;font:17px/1.5 Georgia,serif;padding:24px}
  main{max-width:640px;width:100%}
  img{width:72px;height:72px}
  h1{font:600 30px/1.2 "Arial Narrow",Arial,sans-serif;text-transform:uppercase;margin:16px 0 6px}
  p{margin:0 0 28px;color:#4a433a}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  a{display:block;padding:22px;border:2px solid #151311;border-radius:3px;text-decoration:none;color:inherit}
  a:hover{background:#151311;color:#fff}
  a.dark{background:#151311;color:#f4ede2}
  a.dark:hover{background:#000}
  b{display:block;font:600 20px/1.2 "Arial Narrow",Arial,sans-serif;text-transform:uppercase;margin-bottom:4px}
  small{opacity:.75}
  @media (max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <img src="img/logo.jpg" alt="">
  <h1>Förslag på ny hemsida</h1>
  <p>Två versioner av samma innehåll. Klicka för att se dem – testa gärna i mobilen.</p>
  <div class="grid">
    <a href="klassisk/"><b>Klassisk</b><small>Ljus, som en tryckt meny</small></a>
    <a class="dark" href="modern/"><b>Modern</b><small>Mörk, med sök och filter</small></a>
  </div>
</main>
</body>
</html>
